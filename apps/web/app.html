<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backstory</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fdfbf9'/%3E%3Ccircle cx='9' cy='10' r='3.4' fill='%23fdfbf9' stroke='%23171717' stroke-width='1.6'/%3E%3Ccircle cx='23' cy='10' r='3.4' fill='%23fdfbf9' stroke='%23171717' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='23' r='3.6' fill='%23ff6f1e' stroke='%23171717' stroke-width='1.6'/%3E%3Cpath d='M11.6 12.2 14.3 20M20.4 12.2 17.7 20M12.4 10H19.6' stroke='%23171717' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460;9..144,560;9..144,600;9..144,640;9..144,680&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("backstory-theme");
        var dark = saved ? saved === "dark"
                         : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      /* Superr-style tokens */
      --cream: #fdfbf9;
      --charcoal: #171717;
      --cocoa: #2b1a07;
      --true-black: #000000;
      --dew: #f7efe9;
      --orange: #ff6f1e;
      --sienna: #ce500a;
      --sky: #3b82f6;
      --bubblegum: #ff66cf;
      --sprout: #22c55e;
      --shadow-mist: #bebcbb;
      --gelica: "Fraunces", "Times New Roman", serif;
      --geist: "Inter", "Segoe UI", sans-serif;
      --r-tags: 20px;
      --r-cards: 12px;
      --r-footer: 56px;
      --r-inputs: 8px;
      --r-buttons: 20px;
      --shadow-lg: 0 2px 20px rgba(0, 0, 0, 0.06);
      --shadow-subtle: 0 1px 2px rgba(0, 0, 0, 0.25);

      /* Semantic tokens. Split deliberately: --ink was both the body
         text colour and the filled chat bubble background, and --cream
         was both the page and the text sitting on that bubble, so a
         naive inversion made bubble text invisible. */
      --bg: var(--cream);
      --card: var(--cream);
      --surface: var(--dew);
      --text: var(--charcoal);
      --text-dim: #6f675a;
      --border: var(--charcoal);
      --hairline: rgba(23, 23, 23, 0.14);
      --bubble-bg: var(--charcoal);
      --bubble-fg: #f7f3ec;

      /* legacy aliases so existing component rules pick up the new system */
      --paper: var(--bg);
      --paper-2: var(--surface);
      --ink: var(--text);
      --muted: var(--text-dim);
      --faint: #9a9287;
      --line: var(--hairline);
      --accent: var(--orange);
      --accent-soft: #ffe3d2;
      --ok: #2f4a38;
      --shadow: var(--shadow-lg);
      --sans: var(--geist);
      --serif: var(--gelica);
    }

    /* Dark theme, matching the landing page exactly so moving between
       the two does not feel like two products. */
    :root[data-theme="dark"] {
      --bg: #17130f;
      --card: #1e1813;
      --surface: #241d17;
      --text: #f6f0e9;
      --text-dim: #a99c8d;
      --border: #4a3f34;
      --hairline: rgba(246, 240, 233, 0.14);
      --bubble-bg: #efe7dd;
      --bubble-fg: #17130f;
      --faint: #8d8073;
      --accent-soft: #4a2f1d;
      --shadow-lg: 0 2px 20px rgba(0, 0, 0, 0.5);
      --shadow-subtle: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    /* Author display:flex/inline-flex rules tie with the UA [hidden]
       rule at equal specificity and win on source order, so JS setting
       .hidden = true silently does nothing without this. */
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.5 var(--sans);
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px 12px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
      transition: opacity .15s ease;
    }
    .brand:hover { opacity: .7; }
    .brand-mark {
      width: 26px;
      height: 26px;
      flex: none;
    }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .ghost {
      display: inline-flex;
      align-items: center;
      background: var(--card);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 9px 18px;
      border-radius: var(--r-buttons);
      font-family: var(--geist);
      font-size: 14.5px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: var(--shadow-subtle);
    }
    .ghost:hover { border-color: var(--orange); color: var(--sienna); background: var(--card); }
    .ghost.new-chat { font-weight: 600; border-width: 2px; }
    .btn {
      display: inline-flex;
      align-items: center;
      background: var(--card);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 11px 22px;
      border-radius: var(--r-buttons);
      font-family: var(--geist);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: var(--shadow-subtle);
    }
    .btn:hover { border-color: var(--orange); color: var(--sienna); }
    .btn-lg { padding: 14px 28px; font-size: 16px; margin-top: 8px; }
    .user-chip { display: flex; align-items: center; gap: 8px; }
    .user-chip img { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border); }
    .user-chip span { font-family: var(--geist); font-size: 14px; color: var(--text); }
    .stage {
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }
    .hero {
      padding: 32px 8px 0;
      animation: rise .5s ease;
    }
    .hero-copy--app { max-width: 640px; width: 100%; margin: 0 auto; }
    .app-kicker {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 6px;
    }
    .hero-copy--app p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }
    .scenarios {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 24px;
    }
    .scenario {
      text-align: left;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-cards);
      padding: 16px 16px 14px;
      color: inherit;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), border-color .18s, box-shadow .22s;
    }
    .scenario .n {
      font-family: var(--gelica);
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--orange);
      margin-bottom: 6px;
    }
    .scenario strong {
      display: block;
      font-family: var(--gelica);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .scenario span { color: var(--muted); font-size: 14.5px; }
    .scenario:hover { border-color: var(--orange); transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .scenario:hover strong { color: var(--sienna); }
    .thread {
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      overflow-y: auto;
      padding: 8px 4px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .demo-banner {
      max-width: 760px;
      margin: 0 auto;
      padding: 10px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-cards);
      color: var(--muted);
      font-size: 13.5px;
      text-align: center;
    }
    .msg { max-width: 92%; animation: rise .35s ease; }
    .msg.user { align-self: flex-end; }
    .msg.user .bubble {
      background: var(--bubble-bg);
      color: var(--bubble-fg);
      padding: 12px 16px;
      border-radius: 18px 18px 5px 18px;
    }
    .msg.bot { align-self: flex-start; max-width: 86%; }
    .msg.bot .bubble {
      padding: 14px 16px 12px;
      font-family: var(--gelica);
      font-size: 18.5px;
      line-height: 1.42;
      letter-spacing: -0.015em;
      background: var(--surface);
      border: 1.5px solid var(--hairline);
      border-radius: 6px 18px 18px 18px;
    }
    .msg.bot .bubble .body { display: block; }
    .msg .when {
      font-size: 12px;
      color: var(--faint);
      margin-top: 6px;
    }
    .msg.user .when { text-align: right; }
    .abstain .bubble {
      color: var(--ink);
    }
    .abstain-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 16px;
    }
    .evidence-toggle {
      margin-top: 10px;
      background: none;
      border: 1px solid var(--accent-soft);
      background: var(--accent-soft);
      color: var(--sienna);
      padding: 4px 10px;
      font-size: 12.5px;
      font-family: var(--geist);
      border-radius: 999px;
    }
    .evidence-toggle:hover { border-color: var(--orange); }
    .composer-wrap {
      background: transparent;
    }
    .composer {
      max-width: 760px;
      margin: 0 auto 18px;
      padding: 8px 8px 8px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow-lg);
    }
    .composer textarea {
      flex: 1;
      resize: none;
      border: 0;
      background: transparent;
      padding: 12px 4px 10px;
      min-height: 44px;
      max-height: 140px;
      outline: none;
      color: var(--ink);
      font-family: var(--geist);
      font-size: 16px;
    }
    .composer textarea:focus { border-color: transparent; }
    .mic, .send {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      flex: none;
      font-size: 16px;
    }
    .mic:hover, .send:hover:not(:disabled) { color: var(--sienna); background: var(--surface); }
    .mic.live {
      color: #fff;
      background: var(--orange);
      animation: micPulse 1.1s ease-in-out infinite;
    }
    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,111,30,.45); }
      50% { box-shadow: 0 0 0 8px rgba(255,111,30,0); }
    }
    .send {
      background: var(--orange);
      color: #2b1a07;
    }
    .send:hover:not(:disabled) { background: var(--sienna); color: #fff; }
    .send:disabled { opacity: .35; }
    .mic[hidden] { display: none !important; }
    .status {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 28px 8px;
      color: var(--faint);
      font-size: 13px;
      min-height: 18px;
    }
    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(420px, 100%);
      background: var(--surface);
      border-left: 1.5px solid var(--border);
      box-shadow: var(--shadow);
      transform: translateX(104%);
      transition: transform .28s ease;
      z-index: 20;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(28,23,18,.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
      z-index: 15;
    }
    .scrim.on { opacity: 1; pointer-events: auto; }
    .drawer header {
      padding: 22px 22px 8px;
    }
    .drawer h2 {
      font-family: var(--serif);
      font-weight: 520;
      font-size: 28px;
      margin: 0;
      letter-spacing: -0.03em;
    }
    .drawer .sub { color: var(--muted); margin: 6px 0 0; }
    .mem-list {
      overflow-y: auto;
      padding: 8px 22px 40px;
    }
    .change {
      padding: 22px 0;
      border-top: 1px solid var(--line);
    }
    .change h3 {
      margin: 0 0 14px;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 600;
    }
    .step { display: grid; grid-template-columns: 14px 1fr; gap: 10px; }
    .rail {
      width: 8px;
      justify-self: center;
      background: var(--paper-2);
      position: relative;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--faint);
      position: absolute;
      left: 0;
      top: 6px;
    }
    .dot.now { background: var(--accent); width: 10px; height: 10px; left: -1px; }
    .val { font-size: 20px; font-family: var(--serif); letter-spacing: -0.02em; }
    .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .current-tag { color: var(--accent); font-size: 13px; margin-top: 4px; }
    .quote {
      margin-top: 8px;
      color: var(--muted);
      font-style: italic;
      font-size: 14.5px;
    }
    .empty { color: var(--muted); padding: 24px 0; }
    .thinking { color: var(--faint); font-style: italic; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .lbl-short { display: none; }

    @media (max-width: 720px) {
      .scenarios { grid-template-columns: 1fr; }
      header { padding: 14px 14px 8px; gap: 8px; }
      .hero { padding-top: 16px; }
      .msg { max-width: 100%; }
      .stage { padding: 8px 14px 20px; }
      .composer { margin: 0 12px 14px; padding: 6px 6px 6px 12px; gap: 6px; }
    }

    /* Phones. Three controls plus an avatar do not fit beside the
       wordmark at full size, and the old layout wrapped them on top of
       it. Shorter labels and tighter controls keep the header on one
       row instead. */
    @media (max-width: 560px) {
      .lbl-full { display: none; }
      .lbl-short { display: inline; }
      header { padding: 12px 12px 6px; gap: 6px; }
      /* The wordmark yields first if a device renders the controls wider
         than expected, so the actions can never be pushed off screen. */
      .brand { font-size: 17px; gap: 6px; min-width: 0; overflow: hidden; }
      .brand-mark { width: 21px; height: 21px; flex: none; }
      .header-actions { gap: 6px; flex: none; }
      .ghost {
        padding: 7px 11px;
        font-size: 13px;
        border-width: 1.25px;
        white-space: nowrap;
      }
      .user-chip { gap: 6px; }
      .user-chip img { width: 22px; height: 22px; }
      .app-kicker { font-size: 22px; }
      .hero-copy--app p { font-size: 15px; }
      .scenario { padding: 12px 14px 10px; }
      /* 16px keeps iOS from zooming the whole page in on focus, and the
         taller box stops a two line placeholder being clipped. */
      .composer textarea {
        font-size: 16px;
        min-height: 60px;
        padding: 12px 14px;
      }
      .send { width: 46px; height: 46px; }
      .drawer { width: 100%; }
    }
    @media (min-width: 1100px) {
      .app.open-mem .stage { margin-right: 420px; }
      .app.open-mem header { margin-right: 420px; }
    }
  
    .theme-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; flex: none;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-subtle);
      transition: transform .2s cubic-bezier(.34,1.56,.64,1), border-color .18s ease, color .18s ease;
    }
    .theme-toggle:hover { transform: translateY(-2px) scale(1.05); border-color: var(--orange); color: var(--orange); }
    .theme-toggle svg { width: 17px; height: 17px; }
    .theme-toggle .moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .moon { display: block; }
    @media (max-width: 560px) { .theme-toggle { width: 34px; height: 34px; } .theme-toggle svg { width: 15px; height: 15px; } }
</style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <a class="brand" href="/" aria-label="Backstory home">
        <svg class="brand-mark" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="6" cy="7" r="3.4" fill="var(--card)" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="20" cy="7" r="3.4" fill="var(--card)" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="13" cy="20" r="3.6" fill="#ff6f1e" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8.6 9.2 11.3 17M17.4 9.2 14.7 17M9.4 7H16.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        backstory
      </a>
      <div class="header-actions">
        <button class="ghost new-chat" id="tryBtn" type="button" hidden>
          <span class="lbl-full">+ new chat</span><span class="lbl-short">+ new</span>
        </button>
        <button class="ghost" id="memBtn" type="button" hidden>
          <span class="lbl-full">what it remembers</span><span class="lbl-short">memory</span>
        </button>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.4v2.4M12 19.2v2.4M4.2 12H1.8M22.2 12h-2.4M5.6 5.6 7.3 7.3M16.7 16.7l1.7 1.7M18.4 5.6 16.7 7.3M7.3 16.7 5.6 18.4"/>
          </svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 13.4A8.2 8.2 0 1 1 10.6 4a6.6 6.6 0 0 0 9.4 9.4z"/>
          </svg>
        </button>
        <div class="user-chip" id="userChip" hidden>
          <img id="userAvatar" alt="" />
          <a class="ghost" id="signOutBtn" href="/auth/logout?next=/">
            <span class="lbl-full">sign out</span><span class="lbl-short">out</span>
          </a>
        </div>
      </div>
    </header>

    <div class="stage">
      <section class="hero" id="signinGate" hidden>
        <div class="hero-copy hero-copy--app">
          <h2 class="app-kicker">sign in to continue</h2>
          <p>Your account has its own private, secure memory space.</p>
          <a class="btn btn-lg" id="signInBtn" href="/auth/google/login?next=%2Fapp">sign in with Google →</a>
        </div>
      </section>
      <section class="hero" id="hero" hidden>
        <div class="hero-copy hero-copy--app">
          <h2 class="app-kicker">what should I look up?</h2>
          <p>Ask, tell, or speak. A new chat clears this screen, not the graph.</p>
          <div class="scenarios" id="scenarios">
            <button class="scenario" data-demo="work" type="button">
              <div class="n">01</div>
              <strong>Changed plans</strong>
              <span>Work history that updated, without losing the old job.</span>
            </button>
            <button class="scenario" data-demo="ada" type="button">
              <div class="n">02</div>
              <strong>Remembered across conversations</strong>
              <span>Facts about one person, gathered from three sessions.</span>
            </button>
            <button class="scenario" data-demo="school" type="button">
              <div class="n">03</div>
              <strong>Knows when it does not know</strong>
              <span>A nearby fact exists. The asked one does not.</span>
            </button>
            <button class="scenario" data-demo="thinkpad" type="button">
              <div class="n">04</div>
              <strong>Decision history</strong>
              <span>Why a choice changed, not only what it became.</span>
            </button>
          </div>
        </div>
      </section>
      <div class="thread" id="thread" hidden></div>
    </div>

    <div>
      <div class="status" id="status"></div>
      <div class="composer-wrap" id="composerWrap" hidden>
        <form class="composer" id="form">
          <textarea id="input" rows="1" placeholder="Ask, tell, or tap the mic."></textarea>
          <button class="mic" id="mic" type="button" aria-label="Speak" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3"/>
              <path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8"/>
            </svg>
          </button>
          <button class="send" id="send" type="submit" aria-label="Send">↑</button>
        </form>
      </div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <header>
      <div>
        <h2>What it remembers</h2>
        <p class="sub">Current information, and how it changed.</p>
      </div>
      <button class="ghost" id="closeMem" type="button">Close</button>
    </header>
    <div class="mem-list" id="memList"></div>
  </aside>

<script>
const $ = (id) => document.getElementById(id);

// Theme toggle. The chosen theme is remembered per browser and the
// system preference is only followed until the visitor picks one.
(function () {
  const root = document.documentElement;
  const btn = document.getElementById("themeToggle");
  if (!btn) return;
  const label = () => {
    const dark = root.getAttribute("data-theme") === "dark";
    btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    btn.setAttribute("aria-pressed", String(dark));
  };
  label();
  btn.addEventListener("click", () => {
    const dark = root.getAttribute("data-theme") === "dark";
    if (dark) root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", "dark");
    try { localStorage.setItem("backstory-theme", dark ? "light" : "dark"); } catch (e) {}
    label();
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
    try { if (localStorage.getItem("backstory-theme")) return; } catch (err) {}
    if (e.matches) root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
    label();
  });
})();
const thread = $("thread");
const hero = $("hero");
const signinGate = $("signinGate");
const input = $("input");
const statusEl = $("status");
let demoLoaded = false;
let lastEvidence = [];
let busy = false;

// Identity comes from the Google sign-in session cookie, never from the
// client -- every request that needs a user_key is authenticated
// server-side (Depends(auth.require_user)), so one visitor can never
// read or write another visitor's memory by sending a different id.
async function checkAuth() {
  const me = await fetch("/api/me").then((r) => r.json());
  if (!me.authenticated) {
    const next = "/app" + location.search;
    $("signInBtn").href = "/auth/google/login?next=" + encodeURIComponent(next);
    signinGate.hidden = false;
    hero.hidden = true;
    thread.hidden = true;
    $("tryBtn").hidden = true;
    $("memBtn").hidden = true;
    $("userChip").hidden = true;
    $("composerWrap").hidden = true;
    return false;
  }
  signinGate.hidden = true;
  hero.hidden = false;
  $("tryBtn").hidden = false;
  $("memBtn").hidden = false;
  $("userChip").hidden = false;
  $("composerWrap").hidden = false;
  $("userAvatar").title = me.name || me.email || "";
  if (me.picture) $("userAvatar").src = me.picture;
  else $("userAvatar").style.display = "none";
  return true;
}

const DEMOS = {
  work: {
    seed: [
      { role: "user", text: "I'm working at Company A.", when: "February 4" },
      { role: "user", text: "I left Company A last week.", when: "May 17" },
      { role: "user", text: "I joined Company B.", when: "June 23" },
    ],
    ask: "Where do I work now?",
  },
  ada: {
    seed: [
      { role: "user", text: "Priya is the tech lead on the Atlas migration.", when: "January 12" },
      { role: "user", text: "Priya is based in the Berlin office.", when: "March 8" },
      { role: "user", text: "She now owns the billing API rewrite.", when: "July 2" },
    ],
    ask: "What do I know about Priya?",
  },
  school: {
    seed: [
      { role: "user", text: "We moved staging onto a 16 GB instance last week.", when: "April 1" },
      { role: "user", text: "Production still runs on the 32 GB instance.", when: "April 1" },
    ],
    ask: "How many services run on the 64 GB instance?",
  },
  thinkpad: {
    seed: [
      { role: "user", text: "We're planning to use MongoDB for the events store.", when: "January 20" },
      { role: "user", text: "I think we'll go with Postgres instead.", when: "March 1" },
      { role: "user", text: "We need strong consistency for billing records.", when: "April 9" },
      { role: "user", text: "We standardised on Postgres.", when: "June 1" },
    ],
    ask: "Why did we choose Postgres?",
  },
};

const LABELS = {
  works_at: "Work",
  lives_in: "Where you live",
  located_in: "Location",
  works_as: "Role",
  prefers: "Preference",
  owns: "Owns",
  decided: "Decision",
  bought: "Purchase",
  needs: "Requirement",
  studies: "Studies",
  has: "Has",
  name: "Name",
};

function prettyDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("en-US", { month: "long", day: "numeric" });
}

function humanLabel(predicate) {
  return LABELS[predicate] || predicate.replaceAll("_", " ");
}

function setStatus(text) {
  statusEl.textContent = text || "";
}

function showThread() {
  hero.hidden = true;
  thread.hidden = false;
}

function addMsg(role, html, extra = "") {
  showThread();
  const wrap = document.createElement("article");
  wrap.className = `msg ${role} ${extra}`;
  wrap.innerHTML = `<div class="bubble">${html}</div>`;
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
  return wrap;
}

async function post(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function ensureDemo() {
  if (demoLoaded) return;
  setStatus("Loading sample conversations…");
  await post("/api/demo/load", {});
  demoLoaded = true;
  setStatus("");
}

function collapseFacts(facts) {
  const groups = new Map();
  for (const fact of facts || []) {
    if (!fact.predicate || fact.predicate === "stated") continue;
    const key = fact.predicate;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(fact);
  }
  const stories = [];
  for (const [predicate, rows] of groups) {
    const byValue = new Map();
    for (const row of rows) {
      const value = (row.object_text || "").trim();
      if (!value) continue;
      const bucket = byValue.get(value) || {
        value,
        dates: [],
        quotes: [],
        current: false,
        superseded: false,
      };
      if (row.stated_at) bucket.dates.push(row.stated_at);
      if (row.quote && !bucket.quotes.includes(row.quote)) bucket.quotes.push(row.quote);
      if (row.is_current && row.status !== "superseded") bucket.current = true;
      if (row.status === "superseded" || row.is_current === false) bucket.superseded = true;
      byValue.set(value, bucket);
    }
    const values = [...byValue.values()].sort((a, b) => (a.dates[0] || "").localeCompare(b.dates[0] || ""));
    if (!values.length) continue;
    // Same value marked both current and historical after a second ingest:
    // treat as one memory. Distinct values are a real change.
    const unique = values.map((item) => {
      const first = item.dates.slice().sort()[0];
      return {
        value: item.value,
        date: prettyDate(first),
        iso: first,
        quote: item.quotes.find((q) => !/^Nice|^Congrats|^Sorry/i.test(q)) || item.quotes[0] || "",
        current: item.current && !values.some((other) => other.value !== item.value && other.current && other.dates[0] > (item.dates[0] || "")),
      };
    });
    if (unique.length > 1) {
      const latestCurrent = [...unique].reverse().find((v) => v.current) || unique[unique.length - 1];
      unique.forEach((v) => { v.current = v === latestCurrent; });
    }
    stories.push({ predicate, title: humanLabel(predicate), values: unique });
  }
  stories.sort((a, b) => (a.values[0]?.iso || "").localeCompare(b.values[0]?.iso || ""));
  return stories;
}

function renderMemory(facts) {
  const stories = collapseFacts(facts);
  if (!stories.length) {
    $("memList").innerHTML = `<p class="empty">Nothing remembered yet. Tell Backstory something, or try a memory scenario.</p>`;
    return;
  }
  $("memList").innerHTML = stories.map((story) => {
    const steps = story.values.map((step, i) => `
      <div class="step" style="margin-bottom:${i === story.values.length - 1 ? 0 : 16}px">
        <div class="rail"><span class="dot ${step.current ? "now" : ""}"></span></div>
        <div>
          <div class="val">${escapeHtml(prettyValue(story.predicate, step.value))}</div>
          <div class="meta">${escapeHtml(step.date)}</div>
          ${step.current ? `<div class="current-tag">Current</div>` : ""}
          ${step.quote ? `<div class="quote">“${escapeHtml(clip(step.quote, 140))}”</div>` : ""}
        </div>
      </div>`).join("");
    return `<section class="change"><h3>${escapeHtml(story.title)}</h3>${steps}</section>`;
  }).join("");
}

function prettyValue(predicate, value) {
  if (predicate === "works_at" && value === "unemployed") return "Left previous role";
  return value;
}

function humanizeEvidence(facts) {
  const stories = collapseFacts(facts);
  if (!stories.length) return "";
  const label = (predicate) => humanLabel(predicate).toLowerCase();
  const sentences = stories.map((story) => {
    if (story.values.length === 1) {
      const v = story.values[0];
      return `${label(story.predicate)}: ${prettyValue(story.predicate, v.value)}${v.date ? ` (${v.date})` : ""}.`;
    }
    const first = story.values[0];
    const last = story.values[story.values.length - 1];
    return `${label(story.predicate)}: ${prettyValue(story.predicate, first.value)} on ${first.date}, later ${prettyValue(story.predicate, last.value)} on ${last.date}.`;
  });
  // Different predicates about the same object (e.g. "bought" and "owns"
  // the same thing) can render to the same sentence once the value and
  // date match; keep only the first occurrence.
  const seen = new Set();
  const unique = sentences.filter((s) => {
    if (seen.has(s)) return false;
    seen.add(s);
    return true;
  });
  return unique.join(" ");
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

function openDrawer() {
  $("drawer").classList.add("open");
  $("scrim").classList.add("on");
  $("app").classList.add("open-mem");
  $("drawer").setAttribute("aria-hidden", "false");
}
function closeDrawer() {
  $("drawer").classList.remove("open");
  $("scrim").classList.remove("on");
  $("app").classList.remove("open-mem");
  $("drawer").setAttribute("aria-hidden", "true");
}

async function refreshMemory() {
  const data = await fetch("/api/timeline").then((r) => r.json());
  renderMemory(data.facts || []);
}

function renderAnswer(data) {
  const abstain = data.action === "abstain";
  const evidence = data.evidence || [];
  lastEvidence = evidence;
  let html = `<span class="body">${escapeHtml(data.text)}</span>`;
  if (abstain) {
    html += `<div class="abstain-note">Nothing on record matches what you asked.</div>`;
  } else if (evidence.length) {
    const n = new Set(evidence.map((e) => e.predicate + e.object_text)).size || evidence.length;
    html += `<div><button class="evidence-toggle" type="button" data-open-mem="1">on record · ${n}</button></div>`;
  }
  addMsg("bot", html, abstain ? "abstain" : "");
}

async function ask(question, scope = "real") {
  addMsg("user", escapeHtml(question));
  const thinking = addMsg("bot", `<span class="thinking">Checking the record…</span>`);
  setStatus("");
  try {
    const data = await post("/api/ask", { question, scope });
    thinking.remove();
    renderAnswer(data);
    if (scope === "real") await refreshMemory();
  } catch (err) {
    thinking.remove();
    addMsg("bot", "I could not reach memory just then. Give it another moment.");
    setStatus("");
    return;
  }
  setStatus("");
}

async function remember(text) {
  addMsg("user", escapeHtml(text));
  setStatus("Remembering…");
  try {
    await post("/api/sessions", {
      session_key: "live-" + Date.now(),
      occurred_at: new Date().toISOString().slice(0, 19),
      turns: [{ role: "user", content: text }],
    });
    addMsg("bot", "On record.");
    await refreshMemory();
  } catch (err) {
    addMsg("bot", "I could not store that just then.");
  }
  setStatus("");
}

function looksLikeQuestion(text) {
  return /[?]|(^(what|where|when|why|how|who|can you|do you|did i|tell me)\b)/i.test(text.trim());
}

// Small talk, thanks, and questions about Backstory itself are not
// memories to store and not questions memory can answer. Handling them
// here, entirely client side, keeps the composer from ever replying with
// a mechanical "I will keep that" to something that plainly is not a
// fact worth remembering.
const GREETINGS = ["hi", "hello", "hey", "yo", "sup", "greetings", "good morning", "good afternoon", "good evening", "howdy"];
// A greeting stays a greeting when it is addressed to someone or ends in
// a question mark: "hi backstory?" and "hello there" are not memory
// questions, but an exact match against the list above missed both and
// they fell through to the memory lookup, which then abstained.
const GREETING_RE = new RegExp(
  "^(" + GREETINGS.join("|") + ")\\b[\\s,]*(there|backstory|again|everyone|all)?$",
  "i"
);
function looksLikeGreeting(text) {
  const t = text.trim().toLowerCase().replace(/[.!?]+$/, "");
  return GREETINGS.includes(t) || GREETING_RE.test(t);
}
function greetingReply() {
  const replies = [
    "Here. Ask me what you already told me, or give me something new to keep.",
    "Listening. What should I look up, or what should I write down?",
    "Still here. The graph does not reset when the chat does.",
  ];
  return replies[Math.floor(Math.random() * replies.length)];
}

const CHITCHAT = ["thanks", "thank you", "thx", "ty", "ok", "okay", "cool", "nice", "great", "awesome", "lol", "haha", "bye", "goodbye", "see you", "good night", "sure", "alright", "got it", "np", "no problem"];
const FIRST_PERSON_RE = /\b(i|i'm|im|my|me|mine|myself)\b/;
function looksLikeChitchat(text) {
  const t = text.trim().toLowerCase().replace(/[.!?]+$/, "");
  if (!t || looksLikeQuestion(text)) return false;
  if (CHITCHAT.includes(t)) return true;
  // A short reaction with no first-person pronoun (good, nice one, not
  // bad, sounds good) has nothing in it worth writing to memory. Listing
  // every possible reaction word by word does not scale, so anything
  // this short and this generic is treated as a reaction by default
  // rather than only the handful of words above.
  const words = t.split(/\s+/).filter(Boolean);
  return words.length > 0 && words.length <= 3 && !FIRST_PERSON_RE.test(t);
}
function chitchatReply(text) {
  const t = text.trim().toLowerCase();
  if (/thank/.test(t)) return "Kept.";
  if (/bye|good night/.test(t)) return "I'll still have it when you come back.";
  return "Say more, or ask me what I already have.";
}

const META_RE = /^(what can you do|what do you do|what is backstory|what'?s backstory|how do you work|how does (this|backstory|it) work|how does memory work|who are you|what are you|are you an? ai|are you real|are you human|what('?s| is) this)\??$/i;
function looksLikeMetaQuestion(text) {
  return META_RE.test(text.trim());
}
function metaReply() {
  return "I keep what you tell me as facts in a graph. When something changes I do not erase the old version. When I do not have it, I say so." ;
}

// Announcing that you are about to say something is neither a fact to
// store nor a question memory can answer. "I have a secret to tell you,
// can I go ahead?" was being sent to the memory lookup purely because it
// ends in a question mark, and answered with "I don't have enough
// information", which reads as a non sequitur. "I want to tell you a
// secret" was worse: it got stored as though it were a fact.
const SHARE_INTENT_RE = /\b(?:can|may|shall|should)\s+i\b[^?]*\b(?:tell|share|say|ask|go\s+ahead)\b|\bi\s+(?:want|wanna|would\s+like|need|have|have\s+got|got)\b[^.?]*\b(?:tell|share|say|secret|something)\b|\blet\s+me\s+tell\s+you\b|\bguess\s+what\b|\bare\s+you\s+(?:ready|listening|there)\b/i;
// A copula means the sentence carries actual content, so "I want to tell
// you my name is Eben" must still be remembered rather than treated as a
// bare announcement.
const HAS_CONTENT_RE = /\b(is|are|was|were|am)\b|[=:]/i;
function looksLikeShareIntent(text) {
  const t = text.trim();
  if (HAS_CONTENT_RE.test(t)) return false;
  return SHARE_INTENT_RE.test(t);
}
function shareIntentReply() {
  const replies = [
    "Go ahead. I'll write it down.",
    "I'm listening.",
    "Tell me. It stays on the graph.",
  ];
  return replies[Math.floor(Math.random() * replies.length)];
}

function clearDemoBanner() {
  const banner = $("demoBanner");
  if (banner) banner.remove();
}

async function runDemo(key) {
  if (busy) return;
  busy = true;
  $("send").disabled = true;
  try {
    await ensureDemo();
    thread.innerHTML = "";
    showThread();
    thread.insertAdjacentHTML(
      "beforebegin",
      `<div class="demo-banner" id="demoBanner">Demo scenario — this conversation is example data, not your own. It is kept in a separate sandbox and never mixed with your real memory.</div>`
    );
    const demo = DEMOS[key];
    for (const line of demo.seed) {
      const el = addMsg("user", escapeHtml(line.text));
      el.insertAdjacentHTML("beforeend", `<div class="when">${line.when}</div>`);
      await new Promise((r) => setTimeout(r, 180));
    }
    await ask(demo.ask, "demo");
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  input.style.height = "auto";
  busy = true;
  $("send").disabled = true;
  clearDemoBanner();
  try {
    if (looksLikeGreeting(text)) {
      addMsg("user", escapeHtml(text));
      addMsg("bot", escapeHtml(greetingReply()));
    } else if (looksLikeShareIntent(text)) {
      // Before chitchat: "guess what" is short enough to look like a
      // throwaway reaction, but it is an opening, so it deserves an
      // invitation to continue rather than an acknowledgement.
      addMsg("user", escapeHtml(text));
      addMsg("bot", escapeHtml(shareIntentReply()));
    } else if (looksLikeChitchat(text)) {
      addMsg("user", escapeHtml(text));
      addMsg("bot", escapeHtml(chitchatReply(text)));
    } else if (looksLikeMetaQuestion(text)) {
      addMsg("user", escapeHtml(text));
      addMsg("bot", escapeHtml(metaReply()));
    } else if (looksLikeQuestion(text)) await ask(text);
    else await remember(text);
  } finally {
    busy = false;
    $("send").disabled = false;
    input.focus();
  }
});

// The full placeholder needs three lines in a phone width box, and the
// third was being clipped, so the prompt read "...something to" with the
// point of the sentence missing. Shorter copy on small screens instead
// of a taller box that would eat the conversation area.
const PLACEHOLDER_FULL = "Ask Backstory, or tell it something to remember.";
const PLACEHOLDER_SHORT = "Ask, or tell me something";
const smallScreen = window.matchMedia("(max-width: 560px)");
function syncPlaceholder() {
  input.placeholder = smallScreen.matches ? PLACEHOLDER_SHORT : PLACEHOLDER_FULL;
}
syncPlaceholder();
smallScreen.addEventListener("change", syncPlaceholder);

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});

$("scenarios").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-demo]");
  if (btn) runDemo(btn.dataset.demo);
});
$("tryBtn").onclick = () => {
  hero.hidden = false;
  thread.hidden = true;
  thread.innerHTML = "";
  clearDemoBanner();
};
$("memBtn").onclick = async () => { await refreshMemory(); openDrawer(); };
$("closeMem").onclick = closeDrawer;
$("scrim").onclick = closeDrawer;
thread.addEventListener("click", async (e) => {
  if (e.target.dataset.openMem) {
    await refreshMemory();
    openDrawer();
  }
});

(function () {
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("mic");
  if (!Speech || !mic) return;
  mic.hidden = false;
  const rec = new Speech();
  rec.lang = (navigator.language || "en-US");
  rec.interimResults = true;
  rec.continuous = false;
  let live = false;
  let base = "";
  rec.onstart = () => {
    live = true;
    mic.classList.add("live");
    mic.setAttribute("aria-pressed", "true");
    setStatus("Listening… tap the mic to stop.");
  };
  rec.onend = () => {
    live = false;
    mic.classList.remove("live");
    mic.setAttribute("aria-pressed", "false");
    setStatus("");
  };
  rec.onerror = () => {
    live = false;
    mic.classList.remove("live");
    setStatus("Could not hear that. Type instead.");
  };
  rec.onresult = (ev) => {
    let said = "";
    for (let i = 0; i < ev.results.length; i++) said += ev.results[i][0].transcript;
    input.value = (base ? base.replace(/\s+$/, "") + " " : "") + said.trim();
    input.dispatchEvent(new Event("input"));
  };
  mic.addEventListener("click", () => {
    if (live) { rec.stop(); return; }
    base = input.value;
    try { rec.start(); } catch (e) { setStatus("Voice is not available here."); }
  });
})();

(async () => {
  const signedIn = await checkAuth();
  if (!signedIn) return;
  await refreshMemory().catch(() => {});
  const requestedDemo = new URLSearchParams(location.search).get("demo");
  if (requestedDemo && DEMOS[requestedDemo]) runDemo(requestedDemo);
})();
</script>
</body>
</html>
