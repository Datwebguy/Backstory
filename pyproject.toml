[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backstory"
version = "0.1.0"
description = "Graph-native long-term memory layer for Hack Hydra Track 03"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Backstory" }]
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  # Runtime, not eval only: the engine imports this whenever
  # OPENAI_API_KEY is set, for LLM extraction and answering. Leaving it
  # in the eval extra meant a deployed image built with `pip install .`
  # had a key configured but no client library, so every ingest raised
  # ModuleNotFoundError and surfaced as a 500.
  "openai>=1.40",
]

[project.optional-dependencies]
bolt = ["neo4j>=5.23"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
eval = ["backoff>=2.2", "tqdm>=4.66"]

[project.scripts]
backstory-smoke = "backstory.tools.smoke_hydradb:main"
backstory-api = "backstory.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
